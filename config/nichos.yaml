    contexto_dores: &operacional_dores |
      Empresas com operação em campo enfrentam processos comerciais dispersos,
      orçamentos sem acompanhamento e pouca visibilidade dos retornos recebidos.
    argumentos_venda: &operacional_argumentos |
      Centralizar contatos, propostas e follow-up ajuda a reduzir perdas entre a
      primeira conversa e a contratação.
    tom_abordagem: &operacional_tom |
      Objetivo e prático, com foco em organização comercial e ganho operacional.

